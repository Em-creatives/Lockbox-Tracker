<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key & Lockbox Tracker</title>
  <style>
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0ede6;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.2);
      --text: #1a1a18; --text2: #6b6a65; --text3: #9e9d98;
      --red: #E24B4A; --red-bg: #FCEBEB; --red-text: #A32D2D; --red-border: #F09595;
      --green: #639922; --green-bg: #EAF3DE; --green-text: #3B6D11; --green-border: #C0DD97;
      --blue: #378ADD; --blue-bg: #E6F1FB; --blue-text: #185FA5; --blue-border: #B5D4F4;
      --amber: #BA7517; --amber-bg: #FAEEDA; --amber-text: #854F0B; --amber-border: #FAC775;
      --radius-sm: 8px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252522; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --text: #e8e6df; --text2: #9e9c96; --text3: #65645f;
        --red-bg: #3d1414; --red-text: #F09595; --red-border: #A32D2D;
        --green-bg: #1a2e0a; --green-text: #C0DD97; --green-border: #3B6D11;
        --blue-bg: #0c2240; --blue-text: #85B7EB; --blue-border: #185FA5;
        --amber-bg: #2a1e05; --amber-text: #FAC775; --amber-border: #854F0B;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem 1rem; }
    .container { max-width: 960px; margin: 0 auto; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    h1 { font-size: 22px; font-weight: 700; }
    .sync-indicator { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
    .pulse { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }

    /* Forms, Tabs, and Grid styles same as previous, but optimized for mobile */
    .tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 4px; }
    .tab { padding: 8px 16px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text2); white-space: nowrap; }
    .tab.active { background: var(--text); color: var(--surface); border-color: transparent; }
    
    .section { display: none; animation: fadeIn 0.2s ease-in; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .item-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .item-card.out { border-left: 4px solid var(--red); }
    .item-card.avail { border-left: 4px solid var(--green); }
    .item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .item-status { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 12px; }
    .status-out { color: var(--red); }
    .status-in { color: var(--green); }
    .agent-info { font-size: 12px; color: var(--text2); margin-bottom: 16px; line-height: 1.4; min-height: 34px; }
    
    .btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn-out { background: var(--red); color: white; }
    .btn-in { background: var(--green); color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-box { background: var(--surface2); padding: 1rem; border-radius: var(--radius-lg); margin-bottom: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 500px) { .form-box { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
    .input-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h1>Inventory Tracker</h1>
    <div class="sync-indicator"><div class="pulse"></div> Live Syncing</div>
  </div>
  <p class="sub">Key & Lockbox management for the team.</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('lockbox')">Lockboxes</button>
    <button class="tab" onclick="switchTab('contract')">Contract Boxes</button>
    <button class="tab" onclick="switchTab('log')">History</button>
    <button class="tab" onclick="switchTab('admin')">Admin</button>
  </div>

  <div id="lockbox" class="section active">
    <div class="form-box">
      <div class="input-group">
        <label>Agent Name</label>
        <input type="text" id="agent-name" placeholder="Who is checking out?">
      </div>
      <div class="input-group">
        <label>Property Address</label>
        <input type="text" id="prop-address" placeholder="e.g. 123 Main St">
      </div>
    </div>
    <div id="lb-grid" class="grid"></div>
  </div>

  <div id="contract" class="section">
    <div id="cb-grid" class="grid"></div>
  </div>

  </div>

<script>
  // UPDATE THIS URL WITH YOUR DEPLOYED GOOGLE SCRIPT URL
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbws6V02A67NFq7kjgptzw2OgLjbJc2LHhGFIo5qOLCrGFIk8yljw-RfJ30ZSclFJ_5l/exec';

  let items = { lockboxes: [], contractBoxes: [] };
  let statusMap = {};
  let isUpdating = false;

  async function init() {
    await fetchItems();
    await refreshStatus();
    // Fast Polling: Every 5 seconds to keep data fresh without crashing Google
    setInterval(refreshStatus, 5000);
  }

  async function fetchItems() {
    const res = await fetch(`${SHEET_URL}?type=items`);
    items = await res.json();
    renderGrids();
  }

  async function refreshStatus() {
    if (isUpdating) return;
    try {
      const res = await fetch(`${SHEET_URL}?type=status&t=${Date.now()}`);
      statusMap = await res.json();
      renderGrids();
    } catch (e) { console.error("Sync failed", e); }
  }

  function renderGrids() {
    renderCategory('lb-grid', items.lockboxes, 'Lockbox');
    renderCategory('cb-grid', items.contractBoxes, 'Contract Box');
  }

  function renderCategory(containerId, list, category) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = list.map(item => {
      const s = statusMap[item.id] || { out: false };
      return `
        <div class="item-card ${s.out ? 'out' : 'avail'}">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-status ${s.out ? 'status-out' : 'status-in'}">
              ${s.out ? 'Checked Out' : 'Available'}
            </div>
            <div class="agent-info">
              ${s.out ? `<strong>${s.by}</strong><br>${s.address}` : 'Ready for use'}
            </div>
          </div>
          <button class="btn ${s.out ? 'btn-in' : 'btn-out'}" 
            onclick="handleAction('${item.id}', '${item.name}', '${category}', ${s.out})">
            ${s.out ? 'Check In' : 'Check Out'}
          </button>
        </div>
      `;
    }).join('');
  }

  async function handleAction(id, name, category, isCurrentlyOut) {
    const agent = document.getElementById('agent-name').value.trim();
    const address = document.getElementById('prop-address').value.trim();
    const action = isCurrentlyOut ? 'Check In' : 'Check Out';

    if (!agent) return alert("Please enter your name.");
    if (!isCurrentlyOut && !address) return alert("Please enter property address.");

    // OPTIMISTIC UI: Update instantly for the user
    statusMap[id] = isCurrentlyOut ? { out: false } : { out: true, by: agent, address: address };
    renderGrids();

    // Send to Google
    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors', // Fastest way to send data without waiting for response
        body: JSON.stringify({ agent, address, category, item: name, action })
      });
      // Force a real status refresh 2 seconds later to confirm sync
      setTimeout(refreshStatus, 2000);
    } catch (e) {
      alert("Error syncing. Try again.");
      refreshStatus();
    }
  }

  function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  init();
</script>
</body>
</html>
