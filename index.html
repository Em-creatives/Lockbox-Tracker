<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key & Lockbox Tracker</title>
  <style>
    :root {
      --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0ede6;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.2);
      --text: #1a1a18; --text2: #6b6a65; --text3: #9e9d98;
      --red: #E24B4A; --red-bg: #FCEBEB; --red-text: #A32D2D; --red-border: #F09595;
      --green: #639922; --green-bg: #EAF3DE; --green-text: #3B6D11; --green-border: #C0DD97;
      --blue: #378ADD; --blue-bg: #E6F1FB; --blue-text: #185FA5; --blue-border: #B5D4F4;
      --amber: #BA7517; --amber-bg: #FAEEDA; --amber-text: #854F0B; --amber-border: #FAC775;
      --radius-sm: 8px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252522; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --text: #e8e6df; --text2: #9e9c96; --text3: #65645f;
        --red-bg: #3d1414; --red-text: #F09595; --red-border: #A32D2D;
        --green-bg: #1a2e0a; --green-text: #C0DD97; --green-border: #3B6D11;
        --blue-bg: #0c2240; --blue-text: #85B7EB; --blue-border: #185FA5;
        --amber-bg: #2a1e05; --amber-text: #FAC775; --amber-border: #854F0B;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 960px; margin: 0 auto; }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    h1 { font-size: 24px; font-weight: 600; }
    .sync-indicator { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
    .pulse { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    .sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; }
    .alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 1rem; display: none; }
    .alert-err { background: var(--red-bg); color: var(--red-text); border: 0.5px solid var(--red-border); }
    .alert-ok  { background: var(--green-bg); color: var(--green-text); border: 0.5px solid var(--green-border); }

    .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { padding: 7px 18px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text2); }
    .tab.active { background: var(--text); color: var(--surface); border-color: transparent; }
    .tab-admin { margin-left: auto; border-color: var(--amber-border) !important; color: var(--amber-text) !important; }

    .section { display: none; }
    .section.active { display: block; }

    .form-area { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 150px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; }
    input { width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface); color: var(--text); font-size: 13px; outline: none; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .item-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; border-left: 4px solid var(--green); }
    .item-card.out { border-left-color: var(--red); }
    .item-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
    .badge-out { background: var(--red-bg); color: var(--red-text); }
    .badge-in { background: var(--green-bg); color: var(--green-text); }
    .agent-info { font-size: 12px; color: var(--text2); margin: 8px 0; min-height: 32px; line-height: 1.3; }
    
    .btn { width: 100%; padding: 8px; border-radius: var(--radius-sm); border: none; font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .btn-checkout { background: var(--red); color: white; }
    .btn-checkin { background: var(--green); color: white; }
    .btn-primary { background: var(--blue); color: white; }
    .btn-amber { background: var(--amber); color: white; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Log Table */
    .log-wrap { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .log-table th { text-align: left; background: var(--surface2); padding: 10px; font-size: 11px; color: var(--text2); }
    .log-table td { padding: 10px; border-bottom: 0.5px solid var(--border); }

    /* Admin */
    .admin-login { max-width: 360px; margin: 3rem auto; text-align: center; background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); border: 0.5px solid var(--border); }
    .admin-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
    .admin-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h1>Key Tracker</h1>
    <div class="sync-indicator"><div class="pulse"></div> Live Sync</div>
  </div>
  <p class="sub">Real-time status synced to Google Sheets</p>

  <div id="alertBox" class="alert"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('lockbox')">Lockboxes</button>
    <button class="tab" onclick="switchTab('contract')">Contract Boxes</button>
    <button class="tab" onclick="switchTab('log')">Activity Log</button>
    <button class="tab tab-admin" onclick="switchTab('admin')">Admin</button>
  </div>

  <div id="form-container">
    <div class="form-area">
      <div class="form-row">
        <div class="field"><label>Your Name</label><input type="text" id="global-agent" placeholder="Agent Name"></div>
        <div class="field"><label>Property Address</label><input type="text" id="global-address" placeholder="e.g. 7255 Sagunto Place"></div>
      </div>
    </div>
  </div>

  <div id="lockbox" class="section active"><div id="lb-grid" class="grid"></div></div>
  <div id="contract" class="section"><div id="cb-grid" class="grid"></div></div>

  <div id="log" class="section">
    <div class="log-wrap">
      <table class="log-table">
        <thead><tr><th>Time</th><th>Agent</th><th>Address</th><th>Item</th><th>Action</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </div>

  <div id="admin" class="section">
    <div id="admin-login" class="admin-login">
      <h2>Admin Access</h2><br>
      <input type="password" id="admin-pw" placeholder="Password"><br><br>
      <button class="btn btn-amber" onclick="adminLogin()">Sign In</button>
    </div>
    <div id="admin-panel" style="display:none">
       <div class="admin-panel">
         <h3>Manage Items</h3>
         <div id="admin-items-list"></div>
         <div class="form-row" style="margin-top:15px">
           <input type="text" id="new-item-name" placeholder="Item Name (e.g. Lockbox #5)">
           <button class="btn btn-primary" style="width:100px; margin:0" onclick="addItem()">Add</button>
         </div>
       </div>
       <button class="btn btn-amber" onclick="saveAdminChanges()">Save & Sync All Devices</button>
       <button class="btn" onclick="adminLogout()">Logout</button>
    </div>
  </div>
</div>

<script>
  // REPLACE THIS WITH YOUR URL
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzoGIStsbAsHBHALZsY8o20OeljWCKZ0eCFU_DAqb7hsjLtaIuHrn7IO6Dozd2Fqfgk/exec';

  let items = { lockboxes: [], contractBoxes: [] };
  let statusMap = {};
  let isAdmin = false;

  async function init() {
    await loadItems();
    await loadStatus();
    setInterval(loadStatus, 5000); // 5-second sync
    if(sessionStorage.getItem('isAdmin') === 'true') showAdminPanel();
  }

  async function loadItems() {
    try {
      const r = await fetch(`${SHEET_URL}?type=items`);
      items = await r.json();
      renderGrids();
    } catch(e) { showAlert("Check connection", "err"); }
  }

  async function loadStatus() {
    try {
      const r = await fetch(`${SHEET_URL}?type=status&t=${Date.now()}`);
      statusMap = await r.json();
      renderGrids();
      if(document.getElementById('log').classList.contains('active')) loadLog();
    } catch(e) {}
  }

  function renderGrids() {
    renderCategory('lb-grid', items.lockboxes, 'Lockbox');
    renderCategory('cb-grid', items.contractBoxes, 'Contract Box');
  }

  function renderCategory(containerId, list, catName) {
    const el = document.getElementById(containerId);
    el.innerHTML = list.map(item => {
      const s = statusMap[item.id] || { out: false };
      return `
        <div class="item-card ${s.out ? 'out' : ''}">
          <div class="item-name">${item.name}</div>
          <span class="badge ${s.out ? 'badge-out' : 'badge-in'}">${s.out ? 'Out' : 'Available'}</span>
          <div class="agent-info">${s.out ? `<b>${s.by}</b><br>${s.address}` : 'Ready for checkout'}</div>
          <button class="btn ${s.out ? 'btn-checkin' : 'btn-checkout'}" onclick="doAction('${item.id}', '${item.name}', '${catName}', ${s.out})">
            ${s.out ? 'Check In' : 'Check Out'}
          </button>
        </div>
      `;
    }).join('');
  }

  async function doAction(id, name, cat, isOut) {
    const agent = document.getElementById('global-agent').value.trim();
    const address = document.getElementById('global-address').value.trim();
    if(!agent) return showAlert("Enter your name", "err");
    if(!isOut && !address) return showAlert("Enter property address", "err");

    // Instant UI Update
    statusMap[id] = isOut ? { out: false } : { out: true, by: agent, address };
    renderGrids();

    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ agent, address, category: cat, item: name, action: isOut ? 'Check In' : 'Check Out' })
      });
      showAlert(`${name} synced!`, "ok");
    } catch(e) { showAlert("Sync Error", "err"); }
  }

  // --- ADMIN & LOG LOGIC ---
  function adminLogin() {
    const pw = document.getElementById('admin-pw').value;
    if(pw === '0000') { // Matches your script constant
      isAdmin = true;
      sessionStorage.setItem('isAdmin', 'true');
      sessionStorage.setItem('pw', pw);
      showAdminPanel();
    } else { alert("Wrong Password"); }
  }

  function showAdminPanel() {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    renderAdminList();
  }

  function renderAdminList() {
    const list = [...items.lockboxes, ...items.contractBoxes];
    document.getElementById('admin-items-list').innerHTML = list.map((item, i) => `
      <div class="admin-row"><span>${item.name}</span><button onclick="removeItem(${i})">❌</button></div>
    `).join('');
  }

  function addItem() {
    const name = document.getElementById('new-item-name').value;
    const id = name.toLowerCase().replace(/\s+/g, '_');
    if(name.toLowerCase().includes('lockbox')) items.lockboxes.push({id, name});
    else items.contractBoxes.push({id, name});
    renderAdminList();
  }

  async function saveAdminChanges() {
    const pw = sessionStorage.getItem('pw');
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ type: 'saveItems', password: pw, items })
    });
    alert("Saved! Refreshing...");
    location.reload();
  }

  async function loadLog() {
    const r = await fetch(SHEET_URL);
    const data = await r.json();
    document.getElementById('log-body').innerHTML = data.slice(1).reverse().map(row => `
      <tr><td>${new Date(row[0]).toLocaleTimeString()}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[4]}</td><td>${row[5]}</td></tr>
    `).join('');
  }

  function switchTab(t) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(s => s.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    event.target.classList.add('active');
    if(t === 'log') loadLog();
  }

  function showAlert(m, type) {
    const b = document.getElementById('alertBox');
    b.textContent = m; b.className = `alert alert-${type}`; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 3000);
  }

  init();
</script>
</body>
</html>
