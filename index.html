<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key & Lockbox Tracker</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0ede6;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.2);
      --text: #1a1a18;
      --text2: #6b6a65;
      --text3: #9e9d98;
      --red: #E24B4A; --red-bg: #FCEBEB; --red-text: #A32D2D; --red-border: #F09595;
      --green: #639922; --green-bg: #EAF3DE; --green-text: #3B6D11; --green-border: #C0DD97;
      --blue: #378ADD; --blue-bg: #E6F1FB; --blue-text: #185FA5; --blue-border: #B5D4F4;
      --radius-sm: 8px; --radius-md: 10px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a; --surface: #252522; --surface2: #2e2e2b;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
        --text: #e8e6df; --text2: #9e9c96; --text3: #65645f;
        --red-bg: #3d1414; --red-text: #F09595; --red-border: #A32D2D;
        --green-bg: #1a2e0a; --green-text: #C0DD97; --green-border: #3B6D11;
        --blue-bg: #0c2240; --blue-text: #85B7EB; --blue-border: #185FA5;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
    .sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; }

    /* Alert */
    .alert {
      padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 1rem; display: none;
    }
    .alert-err { background: var(--red-bg); color: var(--red-text); border: 0.5px solid var(--red-border); }
    .alert-ok  { background: var(--green-bg); color: var(--green-text); border: 0.5px solid var(--green-border); }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab {
      padding: 7px 18px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border2); background: var(--surface);
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--text2); transition: all .15s;
    }
    .tab.active { background: var(--text); color: var(--surface); border-color: transparent; }

    /* Sections */
    .section { display: none; }
    .section.active { display: block; }

    /* Form area */
    .form-area {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 150px; }
    label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border2); background: var(--surface);
      color: var(--text); font-size: 13px; outline: none;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-bg); }

    /* Stats */
    .stats { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat {
      background: var(--surface2); border-radius: var(--radius-sm);
      padding: .75rem 1rem; flex: 1; min-width: 100px;
    }
    .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
    .stat-val { font-size: 24px; font-weight: 600; }

    /* Item grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 2rem; }

    /* Item cards */
    .item-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem; transition: border-color .15s;
    }
    .item-card.out { border-color: var(--red); }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .item-name { font-size: 13px; font-weight: 600; }
    .badge {
      font-size: 11px; font-weight: 500; padding: 3px 9px;
      border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-left: 6px;
    }
    .badge-out { background: var(--red-bg); color: var(--red-text); }
    .badge-in  { background: var(--green-bg); color: var(--green-text); }
    .agent-info { font-size: 12px; color: var(--text2); margin-top: 4px; min-height: 16px; line-height: 1.4; }

    /* Buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border2); background: var(--surface);
      font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text);
      transition: all .15s; margin-top: 10px; width: 100%;
    }
    .btn:hover { background: var(--surface2); }
    .btn:active { transform: scale(0.98); }
    .btn.checkout { background: var(--red); color: #fff; border-color: var(--red); }
    .btn.checkout:hover { filter: brightness(0.9); }
    .btn.checkin  { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.checkin:hover  { filter: brightness(0.9); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* Log table */
    .log-wrap {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .log-table th {
      text-align: left; color: var(--text2); font-weight: 500;
      font-size: 12px; padding: 10px 12px; border-bottom: 0.5px solid var(--border);
      background: var(--surface2);
    }
    .log-table td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); }
    .log-table tr:last-child td { border: none; }

    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .dot-out { background: var(--red); }
    .dot-in  { background: var(--green); }

    .loading { text-align: center; color: var(--text2); font-size: 13px; padding: 2rem; }
    .empty { text-align: center; color: var(--text3); font-size: 13px; padding: 2rem; }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 1.25rem .75rem; }
      h1 { font-size: 20px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Key &amp; Lockbox Tracker</h1>
  <p class="sub">Real-time status synced to Google Sheets</p>

  <div id="alertBox" class="alert"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('lockbox')">Supra Lockboxes</button>
    <button class="tab" onclick="switchTab('contract')">Contract Boxes</button>
    <button class="tab" onclick="switchTab('log')">Activity Log</button>
  </div>

  <!-- LOCKBOX SECTION -->
  <div id="lockbox" class="section active">
    <div class="form-area">
      <div class="form-row">
        <div class="field">
          <label>Your Name</label>
          <input type="text" id="lb-agent" placeholder="Agent name" />
        </div>
        <div class="field">
          <label>Listing Address (for check out)</label>
          <input type="text" id="lb-address" placeholder="e.g. 7255 Sagunto Place" />
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Lockboxes</div>
        <div class="stat-val" id="lb-total">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Checked Out</div>
        <div class="stat-val" id="lb-out" style="color:var(--red)">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Available</div>
        <div class="stat-val" id="lb-avail" style="color:var(--green)">—</div>
      </div>
    </div>
    <div class="grid" id="lb-grid">
      <div class="loading">Loading lockbox status…</div>
    </div>
  </div>

  <!-- CONTRACT BOX SECTION -->
  <div id="contract" class="section">
    <div class="form-area">
      <div class="form-row">
        <div class="field">
          <label>Your Name</label>
          <input type="text" id="cb-agent" placeholder="Agent name" />
        </div>
        <div class="field">
          <label>Listing Address (for check out)</label>
          <input type="text" id="cb-address" placeholder="e.g. 2700 Patriot Dr" />
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total Contract Boxes</div>
        <div class="stat-val" id="cb-total">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Checked Out</div>
        <div class="stat-val" id="cb-out" style="color:var(--red)">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Available</div>
        <div class="stat-val" id="cb-avail" style="color:var(--green)">—</div>
      </div>
    </div>
    <div class="grid" id="cb-grid">
      <div class="loading">Loading contract box status…</div>
    </div>
  </div>

  <!-- LOG SECTION -->
  <div id="log" class="section">
    <div class="log-wrap">
      <div id="log-loading" class="loading">Loading activity log…</div>
      <table class="log-table" id="log-table" style="display:none">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Agent</th>
            <th>Address</th>
            <th>Category</th>
            <th>Item</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ─── CONFIG ────────────────────────────────────────────────────────────────
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxio4UIp1v5ge7XYCUesgWA6q2UQI-c7BUTwqsGEj1v-i2qXnF-VMMxZdZKO5ZbHz9U/exec';

  // Edit these arrays to add/remove lockboxes or contract boxes
  const LOCKBOXES = [
    { id: 'lb_33978394', name: 'Lockbox #33978394' },
    { id: 'lb_33713526', name: 'Lockbox #33713526' },
    { id: 'lb_33916196', name: 'Lockbox #33916196' },
    { id: 'lb_33818149', name: 'Lockbox #33818149' },
    { id: 'lb_33978406', name: 'Lockbox #33978406' },
    { id: 'lb_33836356', name: 'Lockbox #33836356' },
    { id: 'lb_33978401', name: 'Lockbox #33978401' },
    { id: 'lb_34358979', name: 'Lockbox #34358979' },
    { id: 'lb_33154292', name: 'Lockbox #33154292' },
  ];

  const CONTRACT_BOXES = [
    { id: 'cb_1', name: 'Contract Box #1' },
    { id: 'cb_2', name: 'Contract Box #2' },
    { id: 'cb_3', name: 'Contract Box #3' },
    { id: 'cb_4', name: 'Contract Box #4' },
  ];
  // ───────────────────────────────────────────────────────────────────────────

  let status = {};
  let pending = {}; // optimistic lock while request is in flight

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(t) {
    document.querySelectorAll('.tab').forEach((el, i) => {
      const tabs = ['lockbox', 'contract', 'log'];
      el.classList.toggle('active', tabs[i] === t);
    });
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.getElementById(t).classList.add('active');
    if (t === 'log') loadLog();
  }

  // ── Alert helper ───────────────────────────────────────────────────────────
  function showAlert(msg, type) {
    const el = document.getElementById('alertBox');
    el.textContent = msg;
    el.className = 'alert ' + (type === 'ok' ? 'alert-ok' : 'alert-err');
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 4500);
  }

  // ── Load status from sheet ─────────────────────────────────────────────────
  async function loadStatus() {
    try {
      const r = await fetch(SHEET_URL + '?type=status&t=' + Date.now());
      status = (await r.json()) || {};
    } catch (e) {
      status = {};
    }
    renderGrids();
  }

  // ── Render both grids ──────────────────────────────────────────────────────
  function renderGrids() {
    renderGrid('lb-grid', LOCKBOXES, 'lb-total', 'lb-out', 'lb-avail', 'Supra Lockbox', 'lb');
    renderGrid('cb-grid', CONTRACT_BOXES, 'cb-total', 'cb-out', 'cb-avail', 'Contract Box', 'cb');
  }

  function renderGrid(gridId, items, totalId, outId, availId, category, prefix) {
    const grid = document.getElementById(gridId);
    let outCount = 0;
    grid.innerHTML = '';

    items.forEach(item => {
      const s = status[item.id];
      const isPending = !!pending[item.id];
      const isOut = s && s.out;
      if (isOut) outCount++;

      const card = document.createElement('div');
      card.className = 'item-card' + (isOut ? ' out' : '');
      card.id = 'card-' + item.id;

      const agentLine = isOut
        ? [s.by, s.address].filter(Boolean).join(' · ')
        : 'Ready to check out';

      card.innerHTML = `
        <div class="item-header">
          <div class="item-name">${item.name}</div>
          <span class="badge ${isOut ? 'badge-out' : 'badge-in'}">${isOut ? 'Out' : 'Available'}</span>
        </div>
        <div class="agent-info">${agentLine}</div>
        <button
          class="btn ${isOut ? 'checkin' : 'checkout'}"
          ${isPending ? 'disabled' : ''}
          onclick="doAction('${item.id}','${item.name}','${isOut ? 'Check In' : 'Check Out'}','${category}','${prefix}')"
        >${isPending ? 'Saving…' : (isOut ? 'Check In' : 'Check Out')}</button>
      `;
      grid.appendChild(card);
    });

    document.getElementById(totalId).textContent = items.length;
    document.getElementById(outId).textContent = outCount;
    document.getElementById(availId).textContent = items.length - outCount;
  }

  // ── Check out / check in ───────────────────────────────────────────────────
  async function doAction(statusKey, itemName, action, category, prefix) {
    const agentEl  = document.getElementById(prefix + '-agent');
    const addrEl   = document.getElementById(prefix + '-address');
    const agent    = agentEl.value.trim();
    const address  = addrEl.value.trim();

    if (!agent) {
      showAlert('Please enter your name before checking ' + (action === 'Check Out' ? 'out.' : 'in.'), 'err');
      agentEl.focus();
      return;
    }
    if (action === 'Check Out' && !address) {
      showAlert('Please enter a listing address for the check out.', 'err');
      addrEl.focus();
      return;
    }

    // Optimistic UI update
    pending[statusKey] = true;
    if (action === 'Check Out') {
      status[statusKey] = { out: true, by: agent, address };
    } else {
      status[statusKey] = { out: false };
    }
    renderGrids();

    const payload = {
      agent,
      address: address || 'Home',
      category,
      item: itemName,
      action,
      statusKey,
    };

    try {
      const r = await fetch(SHEET_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'application/json' },
      });
      const json = await r.json();
      if (!json.success) throw new Error('Server returned failure');
      showAlert(
        `${itemName} ${action === 'Check Out' ? 'checked out to ' + agent : 'checked in'} successfully.`,
        'ok'
      );
      if (action === 'Check Out') addrEl.value = '';
    } catch (e) {
      // Rollback
      showAlert('Failed to sync. Check your internet connection and try again.', 'err');
      if (action === 'Check Out') {
        status[statusKey] = { out: false };
      } else {
        status[statusKey] = { out: true };
      }
      renderGrids();
    } finally {
      delete pending[statusKey];
      renderGrids();
    }
  }

  // ── Load activity log ──────────────────────────────────────────────────────
  async function loadLog() {
    const loading = document.getElementById('log-loading');
    const table   = document.getElementById('log-table');
    loading.style.display = 'block';
    table.style.display   = 'none';

    try {
      const r    = await fetch(SHEET_URL + '?t=' + Date.now());
      const rows = await r.json();
      const tbody = document.getElementById('log-body');
      tbody.innerHTML = '';

      const data = rows.slice(1).reverse(); // skip header, newest first
      if (!data.length) {
        loading.textContent = 'No activity yet.';
        return;
      }

      data.forEach(row => {
        if (!row[1]) return;
        const isOut = row[5] === 'Check Out';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:var(--text2);white-space:nowrap;font-size:12px">${row[0] || ''}</td>
          <td>${row[1] || ''}</td>
          <td>${row[2] || ''}</td>
          <td style="color:var(--text2)">${row[3] || ''}</td>
          <td>${row[4] || ''}</td>
          <td>
            <span class="dot ${isOut ? 'dot-out' : 'dot-in'}"></span>
            ${row[5] || ''}
          </td>
        `;
        tbody.appendChild(tr);
      });

      loading.style.display = 'none';
      table.style.display   = 'table';
    } catch (e) {
      loading.textContent = 'Failed to load log. Try refreshing.';
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadStatus();

  // Auto-refresh status every 60 seconds
  setInterval(loadStatus, 60000);
</script>
</body>
</html>
